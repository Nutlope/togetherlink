name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      harness:
        description: "Live harness to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - claude
          - codex
          - grok
          - live-models-check
          - opencode
          - pi
          - prime

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Deterministic tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false

      - name: Restore Turborepo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run deterministic test groups
        run: pnpm test

      - name: Save Turborepo cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

  live:
    name: Live ${{ matrix.harness }}
    if: github.event_name == 'workflow_dispatch'
    needs: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        harness: ${{ fromJSON(inputs.harness == 'all' && '["claude","codex","grok","opencode","pi","prime"]' || format('["{0}"]', inputs.harness)) }}
    env:
      CI: "true"
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      TOGETHERLINK_DEBUG: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Verify Together secret
        run: |
          if [ -z "$TOGETHER_API_KEY" ]; then
            echo "TOGETHER_API_KEY repository secret is required for live inference tests." >&2
            exit 1
          fi

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false

      - name: Restore Turborepo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Install ${{ matrix.harness }} CLI
        run: |
          case "${{ matrix.harness }}" in
            claude)
              npm install -g @anthropic-ai/claude-code
              claude --version
              echo "TOGETHERLINK_LIVE_TEST_FILE=src/Claude.test.ts" >> "$GITHUB_ENV"
              ;;
            codex)
              npm install -g @openai/codex
              codex --version
              echo "TOGETHERLINK_LIVE_TEST_FILE=src/Codex.test.ts" >> "$GITHUB_ENV"
              ;;
            grok)
              curl -fsSL https://x.ai/cli/install.sh | bash
              echo "$HOME/.grok/bin" >> "$GITHUB_PATH"
              "$HOME/.grok/bin/grok" --version
              echo "TOGETHERLINK_LIVE_TEST_FILE=src/Grok.test.ts" >> "$GITHUB_ENV"
              ;;
            live-models-check)
              npm install -g @anthropic-ai/claude-code @openai/codex
              claude --version
              codex --version
              echo "TOGETHERLINK_LIVE_MODELS_CHECK=1" >> "$GITHUB_ENV"
              echo "TOGETHERLINK_LIVE_TEST_FILE=src/livemodelscheck.test.ts" >> "$GITHUB_ENV"
              ;;
            opencode)
              npm install -g opencode-ai@latest
              opencode --version
              echo "TOGETHERLINK_LIVE_TEST_FILE=src/OpenCode.test.ts" >> "$GITHUB_ENV"
              ;;
            pi)
              npm install -g @earendil-works/pi-coding-agent
              pi --version
              echo "TOGETHERLINK_LIVE_TEST_FILE=src/Pi.test.ts" >> "$GITHUB_ENV"
              ;;
            prime)
              curl -fsSL https://app.primeintellect.ai/prime-agent/install.sh | sh
              prime-agent --version
              echo "TOGETHERLINK_LIVE_TEST_FILE=src/LivePrimeRlm.test.ts" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Build TogetherLink CLI
        run: pnpm exec turbo run build --filter @togetherlink/models --filter @togetherlink/cli

      - name: Run live ${{ matrix.harness }} tests
        run: pnpm --filter @togetherlink/tests test:live

      - name: Stop TogetherLink daemon
        if: always()
        run: node packages/cli/dist/bin/togetherlink.js daemon stop || true

      - name: Upload live test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-${{ matrix.harness }}-artifacts
          path: packages/tests/artifacts/
          if-no-files-found: ignore
          retention-days: 14
